name: Zappix UI checks

# Lint + Robolectric layout tests for UI branches. Does not sign or publish anything.
on:
  push:
    branches:
      - 'ui/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit + layout tests
        env:
          ZAPPIX_SCREENSHOTS: '1'
        run: gradle testDebugUnitTest --stacktrace

      - name: Print UI previews
        if: always()
        run: |
          for f in app/build/screenshots/*.jpg; do
            [ -f "$f" ] || continue
            echo "ZXSHOT-BEGIN $(basename "$f")"
            base64 -w 3000 "$f"
            echo "ZXSHOT-END"
          done

      - name: Lint
        if: always()
        run: gradle lintDebug

      - name: Print lint report
        if: always()
        run: cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: Zappix-UI-reports
          path: |
            app/build/reports/
            app/build/test-results/
