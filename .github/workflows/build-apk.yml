name: Build Zappix APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore permanent Zappix signing key
        env:
          ZAPPIX_KEYSTORE_BASE64: ${{ secrets.ZAPPIX_KEYSTORE_BASE64 }}
        run: |
          test -n "$ZAPPIX_KEYSTORE_BASE64"
          echo "$ZAPPIX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zappix-release.jks"

      - name: Build permanently signed release APK
        env:
          ZAPPIX_KEYSTORE_PATH: ${{ runner.temp }}/zappix-release.jks
          ZAPPIX_KEYSTORE_PASSWORD: ${{ secrets.ZAPPIX_KEYSTORE_PASSWORD }}
          ZAPPIX_KEY_ALIAS: ${{ secrets.ZAPPIX_KEY_ALIAS }}
          ZAPPIX_KEY_PASSWORD: ${{ secrets.ZAPPIX_KEY_PASSWORD }}
        run: |
          test -n "$ZAPPIX_KEYSTORE_PASSWORD"
          test -n "$ZAPPIX_KEY_ALIAS"
          test -n "$ZAPPIX_KEY_PASSWORD"
          gradle assembleRelease
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Zappix-v1.0.15.apk

      - name: Upload signed Zappix APK
        uses: actions/upload-artifact@v4
        with:
          name: Zappix-APK-SIGNED
          path: app/build/outputs/apk/release/Zappix-v1.0.15.apk
