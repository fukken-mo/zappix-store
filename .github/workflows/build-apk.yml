name: Build Zappix APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle assembleRelease

      - name: Prepare release artifact
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/Zappix-v1.0.15-UNSIGNED.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Zappix-Release-Unsigned
          path: app/build/outputs/apk/release/Zappix-v1.0.15-UNSIGNED.apk
